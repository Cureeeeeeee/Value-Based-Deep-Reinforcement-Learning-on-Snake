# Smoke test of the DQN training path on observation B (PLAN.md milestone M6): a small CNN
# (8 planes -> conv 16 -> conv 32 -> 2048 -> 128 -> 3) on the 8x8 board, 48,000 environment
# steps on the CPU with one torch thread, five evaluations of 20 episodes. The observation-B
# counterpart of configs/smoke_8x8.yaml: about 45 s, exercises every file of a DQN run
# directory with the convolutional network, and ends far above the random player (M6
# measurement, two seeds: 9.7 and 13.7 against 0.2). The budget is three times the A
# smoke's because the CNN learns the grid more slowly than the MLP learns the 11 features
# (an 8/8-channel, 32-unit CNN did not leave the random level within 96,000 steps). Not a
# result: too small a network and budget to say anything about the agent.
#
# Run (writes runs/smoke_dqn_B8_W8/0/; a run directory is never overwritten, so pick another
# --seed or --exp to run it again):
#   python -m snake_rl.train --config configs/smoke_B_8x8.yaml --seed 0
# Five seeds through the batch runner:
#   python scripts/run_matrix.py --config configs/smoke_B_8x8.yaml --seeds 0 1 2 3 4 --jobs 5
# Change single values without editing this file. --set needs a new --exp: one experiment
# name is one configuration:
#   python -m snake_rl.train --config configs/smoke_B_8x8.yaml --seed 0 --exp smoke_dqn_B3_W8 --set env.obs.age_plane=false env.obs.heading_planes=false
exp: smoke_dqn_B8_W8
env:
  W: 8
  action_mode: relative
  starve_limit: null             # null -> max(100, W * W) = 100
  obs: {kind: B, age_plane: true, heading_planes: true}   # 8 planes: head, body, food, body age, heading x 4
  reward: {variant: R0}
agent:
  kind: dqn
  gamma: 0.9
  lr: 2.5e-4                     # Adam
  batch_size: 64
  buffer_size: 10000             # transitions
  replay: true
  learning_starts: 1024          # env steps collected before the first gradient step
  grad_steps_per_vec_step: null  # null -> max(1, n_envs // 4) = 4: one gradient step per 4 env steps
  target_update_every: 250       # gradient steps between two hard target syncs
  grad_clip: 10.0                # max global gradient norm
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_fraction: 0.2        # epsilon reaches eps_end after 20 % of total_env_steps
  hidden: [128]                  # fully connected layer after the convolutions
  conv_channels: [16, 32]        # two 3x3 convolutions (the shipped configuration uses 32, 64, 64)
  double: false
  keep_checkpoints: true         # weights-only checkpoint at every evaluation
  device: cpu
  torch_threads: 1
train:
  n_envs: 16
  total_env_steps: 48000
  eval_every: 12000              # a multiple of n_envs; 4 evaluations + the one before any update
  eval_episodes: 20
  eval_seed: 10000
